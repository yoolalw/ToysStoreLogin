<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Toy Store</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
    </head>

    <body>
        <section id="login-register" class="card">
            <h1>Página de Login/Cadastro</h1>
            <label for="user">Digite seu nome de usuário:</label><br>
            <input type="text" name="user" id="user">
            <br>
            <label for="password">Digite sua senha:</label><br>
            <input type="password" name="password" id="password"><br>

            <br>
            <button id="login">Entrar</button>
            <button id="Cadastro">Cadastrar</button>

            <p id="msg-system" class="hidden"></p>
        </section>

        <section id="restrict-area" class="hidden card">
            <h1 id="welcome-msg">Bem vindo(a) a ToyStore!</h1>
            <p id="acess-text">Seu acesso foi liberado com sucesso!</p>

            <button id="logout-button">Sair</button>
        </section>

    </body>
</html>
